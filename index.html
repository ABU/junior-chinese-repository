ackground:#ffefb1;color:#694c00}.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}select{background:white;border:1px solid #9faec4;padding:7px 12px;border-radius:7px;max-width:100%}.primary,.secondary{border-radius:8px;padding:9px 18px;border:1px solid var(--blue)}.primary{background:var(--blue);color:white}.secondary{background:white;color:var(--blue)}.options{display:grid;gap:11px;margin:20px 0}.option{text-align:left;border:1px solid #a8b6cc;background:white;padding:13px 16px;border-radius:9px;color:var(--ink)}.option:hover:not(:disabled){border-color:var(--blue);background:#f4f7fd}.option:disabled{cursor:default;opacity:1}.option.selected{border:2px solid var(--blue);background:#eaf0fc}.option.correct{background:#e8f6ee;border:2px solid #287047}.option.wrong{background:#fff0f0;border:2px solid #a13b42}.feedback{padding:18px;border-radius:9px;background:#eef3fb}.feedback.good{background:#e8f6ee}.feedback.bad{background:#fff0f0}.feedback p:last-child{margin-bottom:0}.progress{width:100%;height:8px;background:#e2e8f3;border-radius:8px;overflow:hidden;margin:15px 0}.progress div{height:100%;background:var(--blue)}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{border-top:1px solid var(--line);padding:20px 0 0;margin-top:18px}.reviewhead{display:flex;justify-content:space-between;align-items:center;gap:16px}.review-item{border-top:1px solid var(--line);padding:22px 0}.review-item h3{font-size:18px}.review-item ol{margin:10px 0;padding-left:28px}.answer{padding:12px 16px;background:#eef3fb;border-radius:8px}a{color:var(--blue);text-underline-offset:3px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{background:#eef3fb}.tablewrap{overflow:auto}footer{max-width:1200px;margin:0 auto;padding:20px 24px 35px;color:var(--muted);font-size:14px}.empty{text-align:center;padding:40px}details{margin:16px 0}summary{cursor:pointer;font-weight:700}.hidden{display:none!important}@media(max-width:760px){header{padding:20px 18px 0}h1{font-size:25px}header .top{align-items:start}.mark{display:none}.wrap{padding:16px}.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:6px}aside button{min-width:145px;margin:0}aside button span{display:none}.card{padding:20px}.two{grid-template-columns:1fr}nav button{padding:10px 12px}h2{font-size:23px}.reviewhead{align-items:start;flex-direction:column}}@media print{header,nav,aside,footer,.notice,.tools,.noprint{display:none!important}.wrap{padding:0}.layout{display:block}.card{border:0;padding:0}.review-item{break-inside:avoid}body{background:white;font-size:12pt}.answer{background:white;border:1px solid #bbb}.hidden{display:none!important}a{color:black}}

<header><div class="top"><h1>國文練習室</h1><span class="mark">臺灣國二上 · 跨版本</span></div><p>讀懂重點，練習辨析，再把理解放進文章。</p><nav aria-label="主要功能"><button data-page="learn" class="active">單元複習</button><button data-page="review">題庫檢閱</button><button data-page="sources">資料來源與影片</button></nav></header>
<main class="wrap"><div class="notice">本版含 9 單元、72 題自編練習。可用於國二上第一次段考準備；各校課文與補充範圍不同，國學題請依老師公告選用。第二版：重寫選項並加入短文題組與理由紀錄。題目難度是編寫分級，尚未經學生實測。</div><div id="app"></div></main><footer>網站與題目整理日期：2026/10/07。練習答案只保留於本次開啟期間；重新整理會清除。核心內容可離線使用，來源與影片連結需連網。</footer>
<script>
const modules=[{"title": "字音字形", "subtitle": "辨認同字異音、同音異字，再完成句中校訂。", "notes": [{"title": "讀音要連同詞義記", "text": "「龜裂」的龜讀ㄐㄩㄣ，「烏龜」讀ㄍㄨㄟ；「參差」讀ㄘㄣ ㄘ，「參加」的參讀ㄘㄢ。不能將單一讀音套到所有詞語。"}, {"title": "三組多音對照", "text": "「處境、處理」的處讀ㄔㄨˇ，「處所、到處」讀ㄔㄨˋ；「盛飯」的盛讀ㄔㄥˊ，「盛況」讀ㄕㄥˋ；「倔強」的強讀ㄐㄧㄤˋ，「勉強」讀ㄑㄧㄤˇ，「強健」讀ㄑㄧㄤˊ。"}, {"title": "用語義區分形近字", "text": "「鍥」與刻削有關，鍥而不捨比喻持續努力；「契」用於契約、契合。「摩擦」指物體接觸擦動，「磨鍊」指經受考驗。部首提供線索，最後仍要確認完整詞義。"}, {"title": "校訂方法", "text": "先圈出疑字，再以完整詞語查核，例如：募款／夜幕、急躁／乾燥、切磋／搓揉。不要只靠某個字看起來熟悉；有些字形可以並用，不適合拿來設唯一答案。"}], "questions": [{"id": "1-1", "level": 1, "prompt": "下列兩個詞中，引號內的字讀音相同的是哪一組？", "options": ["「參」加／「參」差", "「勉強」的強／「倔強」的強", "「盛」飯／「盛」況", "「處」境／「處」理"], "answer": 3, "explanation": "處境與處理均讀ㄔㄨˇ。盛飯ㄔㄥˊ、盛況ㄕㄥˋ；勉強ㄑㄧㄤˇ、倔強ㄐㄧㄤˋ；參加ㄘㄢ、參差ㄘㄣ。要比較指定字，不能因整詞不同就認為字音不同。"}, {"id": "1-2", "level": 1, "prompt": "「他雖然個性倔強，卻不勉強別人接受自己的想法。」兩個「強」的讀音依序是？", "options": ["ㄐㄧㄤˋ／ㄑㄧㄤˊ", "ㄑㄧㄤˊ／ㄑㄧㄤˇ", "ㄐㄧㄤˋ／ㄑㄧㄤˇ", "ㄑㄧㄤˇ／ㄐㄧㄤˋ"], "answer": 2, "explanation": "倔強是固執的性格，強讀ㄐㄧㄤˋ；勉強是強迫或勉力，強讀ㄑㄧㄤˇ。強健、強大才讀ㄑㄧㄤˊ。"}, {"id": "1-3", "level": 2, "prompt": "依詞義填入：「他以＿＿而不捨的精神，尋找最＿＿合主題的材料。」哪一組適當？", "options": ["契／契", "鍥／鍥", "契／鍥", "鍥／契"], "answer": 3, "explanation": "鍥而不捨重在持續刻削、努力不懈；契合指符合。兩字外形接近，不能交換位置，也不能因讀音相近就全部用同字。"}, {"id": "1-4", "level": 2, "prompt": "依詞義填入：「反覆＿＿擦使表面受損；長年的訓練則＿＿鍊了他的耐性。」哪一組適當？", "options": ["磨／摩", "摩／磨", "摩／摩", "磨／磨"], "answer": 1, "explanation": "物體擦動用摩擦；經受考驗用磨鍊。兩句都與反覆動作有關，但字義與固定詞語不同。"}, {"id": "1-5", "level": 2, "prompt": "「夜募低垂，大家仍忙著募款；他有些急燥，便搓揉雙手。」只改錯字，最適當的改法是？", "options": ["第一個募改幕；搓改磋", "第二個募改幕；搓改磋", "第一個募改幕；燥改躁", "第二個募改幕；燥改躁"], "answer": 2, "explanation": "夜幕是夜色，募款是募集；情緒急躁用足部的躁，乾燥用火部的燥。搓揉是動作，用搓正確；切磋學問才用磋。"}, {"id": "1-6", "level": 3, "prompt": "朗讀「盆中的飯已盛好，窗外參差的枝影落在龜裂的牆上」。依序讀「盛、參、龜」，哪組正確？", "options": ["ㄔㄥˊ／ㄘㄣ／ㄐㄩㄣ", "ㄕㄥˋ／ㄘㄣ／ㄐㄩㄣ", "ㄔㄥˊ／ㄘㄢ／ㄍㄨㄟ", "ㄕㄥˋ／ㄘㄢ／ㄍㄨㄟ"], "answer": 0, "explanation": "盛好飯是裝入容器，讀ㄔㄥˊ；參差的參讀ㄘㄣ；龜裂的龜讀ㄐㄩㄣ。必須同時核對三個語境，不能套用較常見讀音。"}, {"id": "1-7", "level": 3, "prompt": "校訂「他處理困境時不急不燥，也不免強同伴，只希望彼此切磋」。若保留原意，應改哪兩處？", "options": ["燥→躁；磋→搓", "燥→躁；免→勉", "免→勉；磋→搓", "處→楚；燥→躁"], "answer": 1, "explanation": "描述情緒用急躁，勉強用勉；處理、切磋都正確。選項中的改字各有形近干擾，必須先判定詞語。"}, {"id": "1-8", "level": 3, "prompt": "有人說：「既然募款和夜幕讀音接近，把『夜幕下募款』寫成『夜募下幕款』也不影響意思。」哪個反駁最切合字形判斷？", "options": ["兩字分別表示夜色與募集，位置交換會破壞詞義", "兩字都可以單獨成詞，因此應只依句子節奏選字", "只要讀音相同，書面上仍應一律採用筆畫較多者", "兩字部首不同，因此任何語境都不能讀相同音"], "answer": 0, "explanation": "幕與募的語義不同，字形承擔辨義功能。部首不同不代表讀音必然不同；筆畫多寡、節奏都不是選字依據。"}]}, {"title": "字義與成語", "subtitle": "區分近義成語的使用條件，辨認語境中的褒貶與範圍。", "notes": [{"title": "近義不等於可互換", "text": "雪中送炭：困難時給予必要協助；錦上添花：在已有成果上再增光彩；畫蛇添足：多做反而壞事；精益求精：在良好基礎上追求更好。先判斷原本處境與後來效果。"}, {"title": "人物表現的差別", "text": "不恥下問：願意向地位或學識較低者請教；虛懷若谷：謙虛而能接納；妄自菲薄：過度輕視自己；目中無人：傲慢而不尊重別人。謙虛不等於否定自己。"}, {"title": "字面與語境", "text": "「薄」在薄霧、薄禮中意義不同。遇多義字，先說出所在詞語的意思，再比對其他語句，不要只看字形相同。"}, {"title": "修正用詞", "text": "成語須同時符合意思、對象與褒貶。改用詞時也要保留程度：『不理解』不必然是『漠不關心』，『再次補充』也不必然是『畫蛇添足』。"}], "questions": [{"id": "2-1", "level": 1, "prompt": "「他把一件薄外套披在身上，另備一份薄禮向老師致謝。」兩個「薄」的意思依序是？", "options": ["不牢固／表示心意不真誠", "不豐厚／形容禮物的厚度小", "厚度小／謙稱禮物不豐厚", "數量少／形容禮物很輕巧"], "answer": 2, "explanation": "薄外套說物理厚度；薄禮通常是謙詞，非否定心意。數量、重量與厚度不能混為一談。"}, {"id": "2-2", "level": 1, "prompt": "某人作品已相當成熟，仍調整細節以提升品質。最符合這個過程的成語是？", "options": ["吹毛求疵", "精益求精", "錦上添花", "畫蛇添足"], "answer": 1, "explanation": "重點是本人持續改善品質，符合精益求精。錦上添花重在再增光彩；畫蛇添足需有多做反而壞事；吹毛求疵重在刻意挑毛病。"}, {"id": "2-3", "level": 2, "prompt": "教授向一名初學者詢問他熟悉的新工具操作方法。若強調教授不受身分高低限制，應選哪個成語？", "options": ["虛懷若谷", "見賢思齊", "妄自菲薄", "不恥下問"], "answer": 3, "explanation": "題幹特別指出身分高低與請教行為，最切合不恥下問。虛懷若谷範圍較廣；妄自菲薄是自我貶低；見賢思齊重在向賢者看齊。"}, {"id": "2-4", "level": 2, "prompt": "哪一句使用「畫蛇添足」最恰當？", "options": ["作品已得高分，再加一段相關例子使說明更清楚", "公告已簡明清楚，又加無關笑話，反使重點難找", "同學已經完成作業，老師另外提供進階練習", "文章初稿有缺漏，補上資料後論證更完整"], "answer": 1, "explanation": "畫蛇添足須符合不必要的增加造成負面影響。相關補充、彌補缺漏與額外練習都不能僅因『多加』就判定為添足。"}, {"id": "2-5", "level": 2, "prompt": "「他知道自己能做好，但仍聽取別人意見」改成哪一句，最能保留原意？", "options": ["他有自信，也能虛心接納建議", "他不恥下問，所以否定自己的能力", "他妄自菲薄，因此全盤接受意見", "他目中無人，卻勉強接受建議"], "answer": 0, "explanation": "有自信與願意接納可以並存。原句沒有過度自貶、傲慢或因請教而否定能力；不可為了套成語增添不存在的態度。"}, {"id": "2-6", "level": 3, "prompt": "家境清寒的小安得到助學金而繼續就學；已有充足經費的社團再獲贈設備而提升表演。依序最適合用哪組成語？", "options": ["雪中送炭／錦上添花", "錦上添花／雪中送炭", "精益求精／錦上添花", "雪中送炭／精益求精"], "answer": 0, "explanation": "前者解決求學所需的困難，後者在已有條件上再提升。精益求精可描述主動追求品質，但題幹重點是外來協助與原有處境。"}, {"id": "2-7", "level": 3, "prompt": "甲：「他不願多談家中的事。」乙因此寫：「他對家人漠不關心。」這個改寫主要有什麼問題？", "options": ["把關心的程度，改成關心對象的數量", "把他人的客觀行為，改成自己的第一人稱感受", "把一時的情緒，誤寫成長期的經濟困難", "把是否公開談論，推成是否關心家人"], "answer": 3, "explanation": "不願談可能有隱私、難以表達等原因，不等於不關心。其餘選項都是常見改寫錯誤，但本題未談經濟、數量或第一人稱。"}, {"id": "2-8", "level": 3, "prompt": "「他處處挑剔同學，連不影響表達的小瑕疵也不放過，卻稱自己是精益求精。」若要指出他用詞掩飾了何種行為，哪項最適當？", "options": ["妄自菲薄，把否定自己說成謙虛態度", "畫蛇添足，把額外補充說成改善內容", "吹毛求疵，把苛刻挑錯說成追求品質", "目不識丁，把缺乏知識說成尊重專業"], "answer": 2, "explanation": "『連不影響表達的小瑕疵也不放過』指向苛刻挑錯。沒有多加內容、自我貶低或不識字的證據，不能僅因都是貶義成語就互換。"}]}, {"title": "詞性與語法", "subtitle": "看詞語在句中做什麼，並分析關聯詞改動後的邏輯。", "notes": [{"title": "名詞與動詞的判斷", "text": "「這份計畫很完整」的計畫可被量詞修飾，指一項事物；「我們計畫明天出發」的計畫表行為。相同詞形可能有不同詞性，須看句中位置及作用。"}, {"title": "形容詞與副詞的判斷", "text": "「仔細的檢查」中仔細修飾名詞性的檢查；「仔細地檢查」中仔細修飾檢查的動作，作副詞用。不能把某個詞永遠固定成一種詞性。"}, {"title": "關聯詞表達的關係", "text": "雖然／但是：轉折；即使／也：假設讓步；只有／才：必要條件；只要／就：充分條件。『只有登記才可參加』不保證登記者一定有名額。"}, {"title": "否定與範圍", "text": "「不都同意」是並非全體同意；「都不同意」是每個人均不同意。「可能、一定、有些、所有」會改變判斷範圍，不能隨意交換。細部詞類名稱依課本約定。"}], "questions": [{"id": "3-1", "level": 1, "prompt": "「他提出一份計畫，並計畫下週實施。」兩個「計畫」的詞性依序是？", "options": ["動詞／名詞", "名詞／名詞", "名詞／動詞", "動詞／動詞"], "answer": 2, "explanation": "前者被『一份』修飾，指方案；後者表示打算做某事。不能因詞形相同就判成同一詞性。"}, {"id": "3-2", "level": 1, "prompt": "「仔細的檢查能減少疏漏」與「他仔細地檢查資料」，兩句中「仔細」的作用依序是？", "options": ["修飾事物／修飾動作", "修飾動作／修飾事物", "修飾事物／連接前後句", "連接前後句／修飾動作"], "answer": 0, "explanation": "第一句的檢查被當作一件事；第二句的檢查是動作。仔細未負責連接句子。這題看語法功能，而非只背詞表。"}, {"id": "3-3", "level": 2, "prompt": "「雖然下雨，活動仍照常舉行」改為「即使下雨，活動也照常舉行」，最主要的變化是？", "options": ["由條件關係，轉為先後時間關係", "由已發生的情況，轉為假設某情況仍成立", "由相反結果，轉為相同結果的原因", "由不確定活動是否舉行，轉為活動已經結束"], "answer": 1, "explanation": "雖然下雨在此承認下雨事實；即使下雨設定假設讓步。兩句都表達雨不妨礙活動，但沒有新增結束時間或原因。"}, {"id": "3-4", "level": 2, "prompt": "公告：「只有完成登記的學生，才可進入候補名單。」根據公告，哪個理解成立？", "options": ["已在候補名單者可能未完成登記", "未進候補名單者必定未完成登記", "完成登記者必定能獲得正式名額", "未完成登記者不能進入候補名單"], "answer": 3, "explanation": "登記是進入候補名單的必要條件，未登記便不能進入。必要條件不保證結果；也不能把『不在名單』反推成『未登記』。"}, {"id": "3-5", "level": 2, "prompt": "「同學不都贊成這個方案」最準確的改寫是？", "options": ["至少有一位同學贊成這個方案", "贊成與反對的同學人數相等", "至少有一位同學不贊成這個方案", "每一位同學都反對這個方案"], "answer": 2, "explanation": "『不都贊成』否定全體贊成，確知至少一人不贊成，卻無法確知有人贊成或兩邊人數。『都不贊成』才否定每一人的贊成。"}, {"id": "3-6", "level": 3, "prompt": "「只要完整填寫表單，就能領取紀念品；未填表者也可憑票根領取。」哪個理解最符合兩句合併後的規定？", "options": ["完整填表是可領取的途徑，卻不是唯一途徑", "沒有填表者都不能領取，後句僅說明例外時間", "有票根者仍須填表，才符合前一句的條件", "完整填表是必要條件，票根只是補充證明"], "answer": 0, "explanation": "只要／就提供充分條件，不排除其他途徑；後句另明定票根途徑。若將填表當成必要條件，便忽略第二句。"}, {"id": "3-7", "level": 3, "prompt": "編輯想保留「並非人人了解」的意思，哪句最適當？", "options": ["只有了解典故的人才算讀者", "不是所有讀者都了解這個典故", "所有讀者都不了解這個典故", "沒有任何讀者不了解這個典故"], "answer": 1, "explanation": "『不是所有都了解』與並非人人了解相同；『所有都不了解』擴大否定，『沒有任何不了解』則變成全了解，最後一項另增身分條件。"}, {"id": "3-8", "level": 3, "prompt": "「他把失敗當作提醒，因此調整方法」若把「因此」換成「然而」，主要會造成什麼問題？", "options": ["把已完成的行動，改成尚未發生的假設", "把兩項同時發生的事，改成相隔多年的事", "把表達個人看法的句子，改成命令他人的句子", "把理由與後續行動的因果，改成預期相反的轉折"], "answer": 3, "explanation": "當作提醒是調整方法的理由，原句表因果。『然而』會暗示調整與前句預期相反；不會自行改變時態、年份或說話對象。"}]}, {"title": "修辭與表達", "subtitle": "區分修辭成立的依據，說明它如何影響語意與感受。", "notes": [{"title": "譬喻與轉化", "text": "譬喻把不同事物連結在相似點上：『路燈像守夜人』以守候作比較。轉化直接賦予事物人的行為：『路燈等我回家』。一個句子可能兼用，題目須限定要判斷的詞句。"}, {"title": "借代的關聯", "text": "借代依真實關聯代替對象，例如以白袍代指醫護人員；譬喻則依相似性作比較。『一張張白袍走進病房』是否成立，還須依全文確認白袍指人而非衣物。"}, {"title": "誇飾、摹寫與設問", "text": "誇飾放大程度，如『等了一世紀』；摹寫呈現感官，如清脆、粗糙、酸澀。問句若旨在引發思考，不必然索取答案；自問自答則稱提問，名稱依課本。"}, {"title": "修辭效果必須扣文本", "text": "不要只寫『使文章生動』。說明哪個形象呈現哪種感受：把車流比作河流，能表現連續流動；把車流比作打結的繩索，則強調擁塞。"}], "questions": [{"id": "4-1", "level": 1, "prompt": "只就指定部分判斷，「路燈『像守夜人』」與「路燈『等我回家』」的表達方式依序最接近？", "options": ["以關聯物代人／以相似性比較", "誇大亮度程度／以關聯物代人", "賦予人的行為／誇大等待時間", "以相似性比較／賦予人的行為"], "answer": 3, "explanation": "『像守夜人』明示比較；『等我回家』直接賦予路燈人的等待。並未用守夜人的相關物品代指，也未交代誇大的程度。"}, {"id": "4-2", "level": 1, "prompt": "「雨點敲在鐵皮上，聲音清脆；掌心摸到粗糙的木紋。」兩個形容詞主要涉及哪兩種感官？", "options": ["觸覺／聽覺", "視覺／觸覺", "聽覺／觸覺", "聽覺／視覺"], "answer": 2, "explanation": "清脆描述聽到的聲音；粗糙在『掌心摸到』的語境中描述觸感。木紋能看見，不代表此處指定詞一定屬視覺。"}, {"id": "4-3", "level": 2, "prompt": "「白袍在走廊上奔忙」若全文確認「白袍」指醫護人員，其借代成立的關鍵是？", "options": ["衣著與穿著者有密切關聯", "衣著的數量被刻意放大", "衣著的顏色與人的情緒相似", "衣著被描寫成能獨立思考"], "answer": 0, "explanation": "衣著代穿著者以關聯成立，不靠相似性。奔忙說的是被代指的人，不能因衣物作主語便一律判成擬人；也沒有數量誇張。"}, {"id": "4-4", "level": 2, "prompt": "「我等了整整一世紀，才聽見老師公布結果。」若實際只等數分鐘，這種誇飾最主要呈現？", "options": ["焦急使短暫等待顯得漫長", "等待者回憶起久遠的歷史", "老師延後公布造成程序混亂", "公布結果時教室顯得安靜"], "answer": 0, "explanation": "時間極度放大呈現主觀焦急。句子沒有聲音環境、程序原因或歷史回憶；不能把修辭當成客觀紀錄。"}, {"id": "4-5", "level": 2, "prompt": "甲「車流像河水，不停流過路口」；乙「車流像打結的繩，卡在路口」。比較兩句，何者最適當？", "options": ["甲著重顏色，乙著重車輛重量", "甲用借代指河流，乙用轉化指繩索", "同用譬喻，兩者都只強調汽車數量多", "同用譬喻，但相似點分別是流動與糾結"], "answer": 3, "explanation": "河水對應連續流動，打結的繩對應擁塞。雖可能都有很多車，指定形象仍各有作用；句中未著重顏色或重量。"}, {"id": "4-6", "level": 3, "prompt": "甲「風替老屋嘆了一口氣」；乙「老屋在風中傳出低沉的聲響」。若把甲改成乙，最主要失去什麼？", "options": ["呈現聲音高低的聽覺描寫", "把聲音連結到情緒的人的形象", "說明老屋存在於風中的場景", "辨認聲音來自哪個場所的線索"], "answer": 1, "explanation": "甲以嘆氣把風聲連結到情緒，乙較接近客觀聲響。乙仍保留老屋、風與低沉聽覺，不能說這些線索都消失。"}, {"id": "4-7", "level": 3, "prompt": "「若每個人都只想等別人先開始，改變要從哪裡來？」這個問句對段落最可能的作用是？", "options": ["要求讀者提供具體地名，補足改變發生的地點", "引導讀者反省等待的態度，支持主動行動的觀點", "藉詢問他人的經驗，證明作者沒有任何看法", "以未回答的問題，撤回前文對行動的主張"], "answer": 1, "explanation": "問句聚焦『每個人都等待』的矛盾，旨在思考行動責任。『哪裡』不必是地名；沒有回答不代表撤回主張或沒有立場。"}, {"id": "4-8", "level": 3, "prompt": "「空椅像一個沒說完的句子」接在一段思念離去親人的文字後。哪個解析最有文本依據？", "options": ["藉句子的長短對比，交代椅子尺寸的差異", "以椅子代指木材，突出家具的材質價值", "用未完成的語句比擬缺席，呈現未盡之情", "把親人直接比成句子，說明雙方語言不通"], "answer": 2, "explanation": "空椅與未說完的句子連結缺席、未完成感。材料價值、尺寸與語言障礙都未見於語境。解析須連結比喻與上下文。"}]}, {"title": "白話文閱讀", "subtitle": "從短文證據作推論，並分清結果、原因與主張範圍。", "notes": [{"title": "事實、推論與越界", "text": "事實是文字明說；推論是由線索得出的合理解讀。『擦長椅、提到陪伴者』可支持懷念，不能證明失智或等待的人必定已過世。"}, {"title": "敘事中的轉折", "text": "人物的新行動常回應前面的理解改變。找出『原本怎麼想→聽到或看見什麼→後來怎麼做』，主旨不只是在重述事件。"}, {"title": "論述與因果", "text": "同時發生不代表已證明唯一原因。措施後垃圾減少可支持試辦有效的可能，仍須看其他範圍與限制。避免把『部分』換成『全部』。"}, {"title": "資料比對與證據強度", "text": "兩則資料要分別找目的、做法、觀察結果與尚未解決的事。答案若新增年代、身分、唯一原因或所有人的想法，檢查是否有文字支持。"}], "questions": [{"id": "5-1", "level": 1, "prompt": "依短文一，阿公說的話最直接回應了「我」的哪一項誤解？", "options": ["以為他不願整理長椅", "以為他不記得以前的陪伴者", "以為他不知道新站的位置", "以為他在等當晚的公車"], "answer": 2, "explanation": "『知道啊』直接回應新站位置；後句才說明舊站的意義。原文未說我認為他懶於整理、等當晚公車或忘記陪伴者。", "passage": "【短文一：舊站牌｜自編】\n新公車站移到大路旁後，巷口的舊站牌還沒拆。阿公每天傍晚仍走到那裡，擦掉長椅上的落葉。我問他是不是忘了新站在哪裡，他笑著說：「知道啊，這裡以前有人陪我等車。」那天我沒有催他回家，只把落葉掃到一旁，陪他坐到天色暗下來。"}, {"id": "5-2", "level": 1, "prompt": "短文一結尾，「我」的行動與前面相比，出現哪個變化？", "options": ["由質疑停留的理由，轉為陪伴他的停留", "由協助打掃長椅，轉為催促他搭車", "由拒絕搬到新站，轉為接受新站安排", "由等待陪伴者出現，轉為獨自離開"], "answer": 0, "explanation": "前面詢問是否忘記，後來不催且坐在身旁。沒有共同搬站、催搭車或我等待第三人的內容。", "passage": "【短文一：舊站牌｜自編】\n新公車站移到大路旁後，巷口的舊站牌還沒拆。阿公每天傍晚仍走到那裡，擦掉長椅上的落葉。我問他是不是忘了新站在哪裡，他笑著說：「知道啊，這裡以前有人陪我等車。」那天我沒有催他回家，只把落葉掃到一旁，陪他坐到天色暗下來。"}, {"id": "5-3", "level": 2, "prompt": "短文二為何先詢問同學，而不立即把書鎖起來？", "options": ["為釐清書未歸還的原因，再調整借閱方式", "為確認三本書的購買價格，再要求賠償", "為挑出可以借書的人，再取消自由借閱", "為證明每位借閱者都守規矩，再撤除登記"], "answer": 0, "explanation": "詢問發現轉借與忘記登記，才改變提醒與登記的位置。未談價格、資格篩選或取消登記，也未證明每個人都守規矩。", "passage": "【短文二：借書架｜自編】\n班上設了自由借書架。第一週，有人發現借出的書少了三本，便提議改用鎖櫃。我們先詢問同學，才知道一本仍在隔壁班，兩本的借閱人忘了登記。大家因此把登記本移到取書處，並在放學前提醒歸還。第二週，少書情況減少了。班長說：「這不表示每個人都已守規矩，只表示規則需要讓人看得見。」"}, {"id": "5-4", "level": 2, "prompt": "班長最後一句話對「少書情況減少」的解讀，主要加入哪個限制？", "options": ["改善結果證明鎖櫃比提醒更沒有作用", "改善結果不足以證明所有人都守規矩", "改善結果只適用於隔壁班借走的那本書", "改善結果表示借閱次數已經全面下降"], "answer": 1, "explanation": "班長明說不表示每個人都守規矩。沒提供借閱總次數，也未實施鎖櫃比較；限制指整體推論，不是縮成某一本。", "passage": "【短文二：借書架｜自編】\n班上設了自由借書架。第一週，有人發現借出的書少了三本，便提議改用鎖櫃。我們先詢問同學，才知道一本仍在隔壁班，兩本的借閱人忘了登記。大家因此把登記本移到取書處，並在放學前提醒歸還。第二週，少書情況減少了。班長說：「這不表示每個人都已守規矩，只表示規則需要讓人看得見。」"}, {"id": "5-5", "level": 2, "prompt": "哪個標題最能涵蓋短文二的問題與解決過程？", "options": ["三本書的尋回與賠償", "鎖櫃保障了每一本書", "讓借閱規則更容易實行", "從自由借閱改為限制借閱"], "answer": 2, "explanation": "全文重點在理解原因並改善流程。賠償、限制資格與實際鎖櫃均未發生；標題不能只抓住曾提出卻未採用的做法。", "passage": "【短文二：借書架｜自編】\n班上設了自由借書架。第一週，有人發現借出的書少了三本，便提議改用鎖櫃。我們先詢問同學，才知道一本仍在隔壁班，兩本的借閱人忘了登記。大家因此把登記本移到取書處，並在放學前提醒歸還。第二週，少書情況減少了。班長說：「這不表示每個人都已守規矩，只表示規則需要讓人看得見。」"}, {"id": "5-6", "level": 3, "prompt": "根據短文三，哪個結論最有依據？", "options": ["教室垃圾未下降，表示走廊的改善也不可信", "借用增加是垃圾減少的唯一原因，無須再觀察", "開放時段已使全校垃圾與掃具遺失同時消失", "開放時段後走廊較整潔，但歸還與教室清潔仍待改善"], "answer": 3, "explanation": "乙分別記錄走廊改善、教室未降、尚未歸還。全校消失與唯一原因超出證據；某區未改善也不會否定另一區觀察。", "passage": "【短文三：兩則公告｜自編】\n甲公告：為減少打掃後地面的垃圾，下週起，掃具室將在午休後開放借用十分鐘；借用者請在當日放學前歸還。\n乙紀錄：原本午休後看見垃圾的同學，常因掃具室關閉而無法清理。試辦一週後，借用次數增加，走廊垃圾減少；但教室內垃圾量未同步下降，值日生仍反映部分掃具尚未歸還。"}, {"id": "5-7", "level": 3, "prompt": "若要判斷「試辦後走廊垃圾減少」是否可能只是天氣或活動改變所致，最值得補充哪組資料？", "options": ["全校學生最喜歡的清潔工具品牌與顏色", "借用者的課業成績與最常閱讀的書籍", "掃具室的建築年份與歷任管理員姓名", "試辦前後同類日子的天氣、活動與垃圾紀錄"], "answer": 3, "explanation": "要檢查替代原因，應比對天氣與活動等可能影響垃圾的條件。品牌、建築史或成績雖可蒐集，未直接處理因果疑問。", "passage": "【短文三：兩則公告｜自編】\n甲公告：為減少打掃後地面的垃圾，下週起，掃具室將在午休後開放借用十分鐘；借用者請在當日放學前歸還。\n乙紀錄：原本午休後看見垃圾的同學，常因掃具室關閉而無法清理。試辦一週後，借用次數增加，走廊垃圾減少；但教室內垃圾量未同步下降，值日生仍反映部分掃具尚未歸還。"}, {"id": "5-8", "level": 3, "prompt": "依短文三，若提議「保留開放時段，再加上借還清單」，其最完整的理由是？", "options": ["因掃具室借用時間過長，所以清單用來縮短午休", "保留走廊改善的做法，同時回應掃具未歸還的問題", "因教室垃圾未下降，所以用清單取代所有打掃工作", "因借用次數增加，所以清單能保證垃圾完全消失"], "answer": 1, "explanation": "提案同時對應已見成效與未解決問題。清單主要追蹤借還，不能代替清潔、保證垃圾消失或自行縮短午休。", "passage": "【短文三：兩則公告｜自編】\n甲公告：為減少打掃後地面的垃圾，下週起，掃具室將在午休後開放借用十分鐘；借用者請在當日放學前歸還。\n乙紀錄：原本午休後看見垃圾的同學，常因掃具室關閉而無法清理。試辦一週後，借用次數增加，走廊垃圾減少；但教室內垃圾量未同步下降，值日生仍反映部分掃具尚未歸還。"}]}, {"title": "文言文閱讀", "subtitle": "依上下文追蹤指代、省略與虛字關係，再推論人物觀點。", "notes": [{"title": "先把人物與動作列出", "text": "閱讀對話先確認誰問誰答。省略的主語常承接前文，但要核對後續動作；翻譯不能因就近看到某人就全部套用。"}, {"title": "「之」不只一種作用", "text": "『讀之』的之可代讀的內容；『師之言』可譯老師的話；『之市』的之可作往、到。先看前後結構：動詞後、名詞間、地點前，常提供不同線索。"}, {"title": "「而、於、乃」的語境", "text": "而可連接動作或形成轉折，須依兩件事的關係判斷。問於甲中的於引出詢問對象；反覆讀後乃得其意，乃連結過程與結果。不要把每個虛字固定翻成同一字。"}, {"title": "寓意須符合對照", "text": "短文常用兩人的相反行動與結果呈現觀點。可推得『器具不能取代練習』，不應過度推成『好器具必定妨礙學習』。"}], "questions": [{"id": "6-1", "level": 1, "prompt": "文言短文一中，「問於甲」的主語與對象分別是？", "options": ["甲／乙", "乙／甲", "乙／甲與乙", "甲與乙／作者"], "answer": 1, "explanation": "承接『乙有所不解』，提問者是乙，於甲引出對象甲。甲後來答話，不是這個問句的主語。", "passage": "【文言短文一｜自編】\n甲與乙同讀。乙有所不解，問於甲。甲曰：「吾亦未明，盍共求之？」二人反覆讀之，乃得其意。\n注：盍，何不；乃，才、於是（依語境判斷）。"}, {"id": "6-2", "level": 1, "prompt": "短文一的「吾亦未明」最適當的翻譯是？", "options": ["我們已經明白了", "你還沒有向我說明", "我也不打算說明白", "我也還沒有弄明白"], "answer": 3, "explanation": "吾在甲的話中指甲，亦是也，未是尚未；明指理解。不能把未解轉成不願說明，也不能換成乙或二人。", "passage": "【文言短文一｜自編】\n甲與乙同讀。乙有所不解，問於甲。甲曰：「吾亦未明，盍共求之？」二人反覆讀之，乃得其意。\n注：盍，何不；乃，才、於是（依語境判斷）。"}, {"id": "6-3", "level": 2, "prompt": "短文一「二人反覆讀之」的「之」，與下列何者作用最相近？", "options": ["友人贈書，吾閱之", "讀書之樂，不可盡言", "此乃師之言也", "明日將之市"], "answer": 0, "explanation": "讀之、閱之的之代先前的閱讀內容；師之言、讀書之樂表修飾關係；之市的之作往。不能僅因都有之就說功能相同。", "passage": "【文言短文一｜自編】\n甲與乙同讀。乙有所不解，問於甲。甲曰：「吾亦未明，盍共求之？」二人反覆讀之，乃得其意。\n注：盍，何不；乃，才、於是（依語境判斷）。"}, {"id": "6-4", "level": 2, "prompt": "短文一從「未明」到「得其意」，最有依據的過程說明是？", "options": ["兩人放棄閱讀，轉而請別人解釋", "甲先給答案，再要求乙反覆背誦", "乙假裝不懂，藉詢問考驗甲的學問", "兩人承認未懂，再一起反覆閱讀而理解"], "answer": 3, "explanation": "盍共求之、二人反覆讀之直接支持共同探究。乙假裝、甲已給答案、請第三人都沒有文句依據。", "passage": "【文言短文一｜自編】\n甲與乙同讀。乙有所不解，問於甲。甲曰：「吾亦未明，盍共求之？」二人反覆讀之，乃得其意。\n注：盍，何不；乃，才、於是（依語境判斷）。"}, {"id": "6-5", "level": 2, "prompt": "短文二「遂購良弓而不習」的「而」，在這裡連接哪一種關係？", "options": ["買弓之後，就必定射得準的條件", "買了好弓，卻沒有練習的轉折", "買弓與練習同時進行的並列", "先不練習，所以買好弓的因果"], "answer": 1, "explanation": "良弓通常需配合練習，甲卻不習，形成轉折。遂連接此前想法與購弓；不能把而單獨理解成必定射準。", "passage": "【文言短文二｜自編】\n村有二人，皆欲學射。甲曰：「弓良，則射必善。」遂購良弓而不習。乙弓雖舊，日習之。旬後，甲十發一中，乙十發七中。甲愧，問其故。乙曰：「器可助人，不能代人習也。」\n注：射，射箭；旬，十日；發，射出箭。"}, {"id": "6-6", "level": 3, "prompt": "短文二甲的主張主要被哪個結果質疑？", "options": ["持良弓者比持舊弓者購買器具的時間晚", "兩人都想學射箭，卻選了不同的新弓", "持良弓但不練習者，命中數少於持舊弓而練習者", "持舊弓者在十日後也沒有每次都射中"], "answer": 2, "explanation": "甲認為好弓保證善射，命中對比顯示良弓不能取代練習。乙未全中不直接反駁甲的保證；新弓與購買時間未寫出。", "passage": "【文言短文二｜自編】\n村有二人，皆欲學射。甲曰：「弓良，則射必善。」遂購良弓而不習。乙弓雖舊，日習之。旬後，甲十發一中，乙十發七中。甲愧，問其故。乙曰：「器可助人，不能代人習也。」\n注：射，射箭；旬，十日；發，射出箭。"}, {"id": "6-7", "level": 3, "prompt": "「甲愧，問其故」中的「其故」，依上下文最可能指？", "options": ["村中為何只有二人習射的原因", "乙為何最初也想學射箭的原因", "自己持良弓卻射不如乙的原因", "良弓價格為何高於舊弓的原因"], "answer": 2, "explanation": "其故承接命中差異與甲的羞愧，問結果為何不符期待。全文未交代村中只兩人、價格或乙最初動機。", "passage": "【文言短文二｜自編】\n村有二人，皆欲學射。甲曰：「弓良，則射必善。」遂購良弓而不習。乙弓雖舊，日習之。旬後，甲十發一中，乙十發七中。甲愧，問其故。乙曰：「器可助人，不能代人習也。」\n注：射，射箭；旬，十日；發，射出箭。"}, {"id": "6-8", "level": 3, "prompt": "下列哪個現代例子最切合短文二乙的觀點？", "options": ["買了好字典仍要練習查詞與運用，工具不能代替學習", "字典越完整越使人依賴，所以學習時應完全不用", "只要使用舊字典，查詞能力就會比用新字典好", "查詞的速度全由天分決定，與工具和練習無關"], "answer": 0, "explanation": "乙說器可助人，不能代人習，既承認工具作用，也強調練習。沒有否定新工具、要求不用工具或只靠天分。", "passage": "【文言短文二｜自編】\n村有二人，皆欲學射。甲曰：「弓良，則射必善。」遂購良弓而不習。乙弓雖舊，日習之。旬後，甲十發一中，乙十發七中。甲愧，問其故。乙曰：「器可助人，不能代人習也。」\n注：射，射箭；旬，十日；發，射出箭。"}]}, {"title": "詩歌閱讀", "subtitle": "從具體意象推論情緒，分析對比、節奏與未說出的意思。", "notes": [{"title": "意象不是固定符號", "text": "河可以表離別，也可表生命流動；雨可以帶出期待或思念。判斷時連讀人物動作與後句，不背『雨＝悲傷』的固定對照。"}, {"title": "字詞、節奏與結構", "text": "重複、疊字、短行可讓節奏或感受突出。要比較詩句的關係：快的水流與靜的岸邊形成動靜對照，不只是『都有形容詞』。"}, {"title": "象徵的合理範圍", "text": "未寄出的話折成紙船，可把思念具體化；這不證明真實寄信失敗或對方身分。詩常保留空白，推論應留在文字可支持的範圍。"}, {"title": "比較兩首詩", "text": "先找共同景物，再比較動作、等待對象與時間指向：種子醒來指向未來，舊杯與不再響起的晚安指向過去的連結。"}], "questions": [{"id": "7-1", "level": 1, "prompt": "短詩一的「沒有寄出的話」最有依據的理解是？", "options": ["寫錯地址而退回的信", "因郵資不足而留下的信", "尚未向對方表達的心意", "已被對方拒收的信件"], "answer": 2, "explanation": "詩中只確知話未送出，能支持未表達的心意。拒收、地址與郵資都是可能的故事，卻沒有文字線索支持。", "passage": "【短詩一：遠方｜自編】\n你說離別像一條河\n我便每天到岸邊\n把沒有寄出的話\n折成一隻隻紙船\n水流很快\n快得像日子\n岸邊很靜\n靜得只剩我的腳步"}, {"id": "7-2", "level": 1, "prompt": "短詩一水流的「快」與岸邊的「靜」主要形成什麼關係？", "options": ["河面寬窄與岸邊遠近的比較", "流動的時間與停留的人的對照", "白日嘈雜與深夜無聲的轉變", "紙船大小與人的力量的對比"], "answer": 1, "explanation": "快得像日子點出時間流逝；岸邊只剩腳步呈現人的停留。沒有尺寸、日夜或力量的描寫。", "passage": "【短詩一：遠方｜自編】\n你說離別像一條河\n我便每天到岸邊\n把沒有寄出的話\n折成一隻隻紙船\n水流很快\n快得像日子\n岸邊很靜\n靜得只剩我的腳步"}, {"id": "7-3", "level": 2, "prompt": "短詩一把「話」折成紙船，這個表達最主要的作用是？", "options": ["證明說話者已經停止等待", "暗示收信人必定住在河的下游", "讓無形的心意具有可看見的寄託", "交代寫信使用的紙張材質"], "answer": 2, "explanation": "紙船使心意可被想像，也連接河的意象。沒有指定材質、停止等待或下游住處；具體形象不等於現實地址。", "passage": "【短詩一：遠方｜自編】\n你說離別像一條河\n我便每天到岸邊\n把沒有寄出的話\n折成一隻隻紙船\n水流很快\n快得像日子\n岸邊很靜\n靜得只剩我的腳步"}, {"id": "7-4", "level": 2, "prompt": "短詩二甲乙都寫雨洗亮窗，情感差異主要來自？", "options": ["甲用白話而乙用文言的不同", "說話者年齡與職業的不同", "雨勢強弱與窗戶大小的不同", "後續動作與等待對象的不同"], "answer": 3, "explanation": "甲等種子醒來，乙等不再有的晚安，使相同雨景承載不同感受。其餘條件均未寫出，兩首也都是白話。", "passage": "【短詩二：同一場雨｜自編】\n甲：雨洗亮窗，我把空花盆搬到簷下，等一粒種子醒來。\n乙：雨洗亮窗，我把你的舊杯放回桌上，等一句不再響起的晚安。"}, {"id": "7-5", "level": 2, "prompt": "若給短詩二甲與乙各選一組關鍵詞，哪組最合適？", "options": ["甲：責任與自責；乙：競爭與失落", "甲：萌發與期待；乙：缺席與思念", "甲：離別與放棄；乙：成長與希望", "甲：忙碌與焦慮；乙：平靜與滿足"], "answer": 1, "explanation": "種子醒來指向新生，不再響起的晚安指向缺席。乙表面動作安靜不等於內心滿足，甲搬花盆也不能直接推成焦慮。", "passage": "【短詩二：同一場雨｜自編】\n甲：雨洗亮窗，我把空花盆搬到簷下，等一粒種子醒來。\n乙：雨洗亮窗，我把你的舊杯放回桌上，等一句不再響起的晚安。"}, {"id": "7-6", "level": 3, "prompt": "短詩三「箱子吞下」與「卻吞不下」的對照，最主要區分了什麼？", "options": ["可搬走的物件與留在場所的生命記憶", "能賣出的用品與無法出售的建材", "父親願意搬的物件與拒絕搬的物件", "屋內重要的收藏與沒有價值的雜物"], "answer": 0, "explanation": "書本等可裝箱，身高刻痕留在門框且承載成長記憶。沒有父親拒絕、價值排名或出售計畫的證據。", "passage": "【短詩三：搬家｜自編】\n箱子吞下了書本、照片和舊外套\n卻吞不下門框上的身高刻痕\n父親把最後一箱搬上車\n我又回頭，看了一眼空屋\n原來帶得走的已經裝好\n帶不走的，才剛開始清點"}, {"id": "7-7", "level": 3, "prompt": "短詩三末兩句若改成「所有物品都裝上車，搬家終於完成」，最主要刪去了原詩哪一層意思？", "options": ["搬運結束後，對記憶與離別的整理才開始", "父親搬運過程中，物品數量尚未核對清楚", "搬家結束後，新屋仍需要添購家具", "屋內尚有大型物品，不能用普通箱子裝走"], "answer": 0, "explanation": "原詩藉帶得走／帶不走轉向記憶的清點。改句只剩搬運完成；添購家具、大型物品、數量核對未寫出。", "passage": "【短詩三：搬家｜自編】\n箱子吞下了書本、照片和舊外套\n卻吞不下門框上的身高刻痕\n父親把最後一箱搬上車\n我又回頭，看了一眼空屋\n原來帶得走的已經裝好\n帶不走的，才剛開始清點"}, {"id": "7-8", "level": 3, "prompt": "下列何者對短詩三的解讀超出文字證據？", "options": ["物件裝箱與記憶清點形成兩種整理", "回頭看空屋透露對舊生活的留戀", "身高刻痕使搬家不只是物件移動", "父親曾反對搬家，所以刻意留下門框紀念"], "answer": 3, "explanation": "詩只寫父親搬箱，未寫反對與刻意留下；其餘解讀分別有刻痕、回頭、末兩句支持。題目問越界，而非哪項最感人。", "passage": "【短詩三：搬家｜自編】\n箱子吞下了書本、照片和舊外套\n卻吞不下門框上的身高刻痕\n父親把最後一箱搬上車\n我又回頭，看了一眼空屋\n原來帶得走的已經裝好\n帶不走的，才剛開始清點"}]}, {"title": "國學常識", "subtitle": "將文體、作品與材料用途連結；依學校課文選讀本單元。", "notes": [{"title": "古體與近體不能只看句數", "text": "近體詩常見絕句四句、律詩八句，五言、七言指每句字數；律詩通常中間兩聯對仗。古體詩也可能四句或八句，定類還需核對格律，不可把『八句』當充分條件。"}, {"title": "《古詩十九首》與選集", "text": "《古詩十九首》是重要五言古詩，一般認為與東漢文人作品有關，收錄於《昭明文選》。選集編者、詩歌作者與故事人物是不同角色，不能把蕭統直接當十九首詩的作者。"}, {"title": "《世說新語》與《史記》", "text": "《世說新語》一般歸於劉義慶編撰，記錄人物言談軼事，適合從短篇細節看人物。《史記》為司馬遷所著紀傳體通史，以人物傳記等體例敘史；不同於逐年排事的編年體。"}, {"title": "作品知識如何用在閱讀", "text": "知道文體可形成閱讀方向，不能代替本文證據。人物軼事可分析行動性格，史傳可注意史事與敘述，仍不可只憑書名推定每一段的褒貶。以上均為課文相關補充，不代表各校必考。"}], "questions": [{"id": "8-1", "level": 1, "prompt": "筆記寫：「五言律詩通常每句五字，共八句。」這裡「五言」與「律詩」分別提供哪兩項資訊？", "options": ["全詩句數／押韻字的數量", "每聯字數／作者生活的時代", "全詩字數／詩中人物的身分", "每句字數／詩體及其常見結構"], "answer": 3, "explanation": "五言指每句五字；律詩是具有格律要求的詩體，常見八句。『言』不是全詩句數、每聯或全詩字數。"}, {"id": "8-2", "level": 1, "prompt": "整理《古詩十九首》與《昭明文選》的關係，哪個說明適當？", "options": ["後者是前者每首詩的逐句白話翻譯", "前者是收錄於後者的五言古詩作品群", "後者是依前者故事改編的人物傳記", "前者是後者編者自作的十九首近體詩"], "answer": 1, "explanation": "《昭明文選》是選集；收錄不等於編者創作，也不等於翻譯或史傳改編。十九首屬古詩，不是蕭統自作近體詩。"}, {"id": "8-3", "level": 2, "prompt": "某詩每句七字，共四句。僅憑這兩項資訊，最審慎的判斷是？", "options": ["可確定是五言古詩，因為全詩有四句", "可確定是七言律詩，不需再看其他條件", "符合七言絕句的外形，仍須核對格律等條件", "可排除所有古體詩，因為古體不會只有四句"], "answer": 2, "explanation": "七字四句是七言絕句的常見外形，但古體也能四句。律詩常見八句；五言指每句五字。不能只憑句數排除古體。"}, {"id": "8-4", "level": 2, "prompt": "閱讀一段《世說新語》人物軼事，最合適的初步整理方式是？", "options": ["列出人物言行，再用細節說明可能的性格", "只統計每句字數，再判斷平仄與押韻", "先把人物分成好壞，再刪去不符合分類的細節", "只列事件年份，再按年逐條排列所有史事"], "answer": 0, "explanation": "軼事可從言行判讀人物。編年、格律並非此類短篇的主要閱讀任務；也不能預先分類再刪證據。"}, {"id": "8-5", "level": 2, "prompt": "下列哪組「作品—相關人物—角色」配對適當？", "options": ["《史記》—劉義慶—選集編者", "《世說新語》—司馬遷—故事主角", "《史記》—司馬遷—作者", "《古詩十九首》—蕭統—十九首詩的作者"], "answer": 2, "explanation": "司馬遷是《史記》作者；劉義慶與《世說新語》編撰相關；蕭統為《昭明文選》編者，不能直接當全部收錄詩作者。"}, {"id": "8-6", "level": 3, "prompt": "兩份筆記：甲按人物分篇，再敘其一生事蹟；乙按年份，逐年記不同人物的事件。哪個比較最適當？", "options": ["兩者都按年份分篇，只是年代長短不同", "甲接近編年體組織，乙接近紀傳體組織", "兩者都按人物分篇，只是人物數量不同", "甲接近紀傳體組織，乙接近編年體組織"], "answer": 3, "explanation": "主要編排單位分別是人物與年份。篇中也可能提日期或人物，但定體例應看整體組織，而非有沒有某種資訊。"}, {"id": "8-7", "level": 3, "prompt": "學生說：「《世說新語》記人物軼事，所以每個篇章都在讚美主角。」哪個修正最適當？", "options": ["既然是軼事，人物的行為細節對閱讀沒有作用", "文體可提示看言行，褒貶仍須依篇章細節判斷", "人物軼事必定諷刺主角，應把所有篇章反向解讀", "只要知道編者姓名，就能直接判定每段的態度"], "answer": 1, "explanation": "作品類型不能保證每篇相同立場。全面改成諷刺、只看編者或取消細節都同樣忽略本文證據。"}, {"id": "8-8", "level": 3, "prompt": "一份資料只寫「本文節選自《昭明文選》」。據此最不能直接確定哪件事？", "options": ["本文每一句都是蕭統親自創作", "選集編者與篇章作者須分別核對", "本文被選入這部作品選集", "閱讀時可再查所收篇章的作者"], "answer": 0, "explanation": "節選只指出收錄來源，不能將編者當原作者。其餘是可成立的來源理解或核對步驟，並非宣稱未知作者身分。"}]}, {"title": "寫作與組織", "subtitle": "檢查題目限制、材料功能、段落銜接與論述的分寸。", "notes": [{"title": "審題要找關鍵關係", "text": "〈那次，我學會先聽完〉不只寫一次討論；還要呈現原本沒有聽完、理解改變的契機與後來做法。事件熱鬧、結局得獎都不能代替『學會』的歷程。"}, {"title": "取材要說得出作用", "text": "留下能推動轉折或支持主旨的材料。新筆記本若與聆聽改變無關，便分散焦點；若補充它用來先記下他人理由，才可能連上主旨。"}, {"title": "組織、承接與視角", "text": "依『困難→發現→調整→反思』安排，不必每篇固定四段。代詞指向、動作先後、句子因果都要清楚；增添華麗詞語不能修補斷裂的關係。"}, {"title": "修訂論述與程度", "text": "用具體事件支持觀點，保留合理範圍。『這次更順利』不等於『以後任何問題都能解決』；修訂要避免空泛重複、過度保證與改掉原本意思。"}], "questions": [{"id": "9-1", "level": 1, "prompt": "依寫作材料一，題目最要求文章交代哪個核心關係？", "options": ["從購買筆記本到改變讀書成績的經過", "從急著反駁到願意先聽完的學習歷程", "從報告準備到得到好評的完整時間表", "從同學建議到證明自己的意見較好的過程"], "answer": 1, "explanation": "題目關鍵是『學會先聽完』，須呈現態度及行動轉變。得評、筆記本與勝過同學都不是題目要求的核心。", "passage": "【寫作材料一｜自編】\n題目：〈那次，我學會先聽完〉\n原稿：討論報告時，我一聽見阿哲的建議就反駁。他停下來問：「你知道我為什麼這樣排嗎？」我才發現，自己只看了前兩頁。聽完他的說明後，我們重新分工。報告那天得到好評，我也買了一本新的筆記本。"}, {"id": "9-2", "level": 1, "prompt": "材料一哪項細節最直接構成「我」改變態度的契機？", "options": ["報告得到好評，證明老師喜歡新分工", "發現自己只看了前兩頁，未理解建議的理由", "聽見同學提出建議，認為分工已完成", "買到新筆記本，打算整理更多資料"], "answer": 1, "explanation": "發現資訊不完整使我願意聽說明。好評在後、筆記本未連結；一聽建議時反而立即反駁，尚未改變。", "passage": "【寫作材料一｜自編】\n題目：〈那次，我學會先聽完〉\n原稿：討論報告時，我一聽見阿哲的建議就反駁。他停下來問：「你知道我為什麼這樣排嗎？」我才發現，自己只看了前兩頁。聽完他的說明後，我們重新分工。報告那天得到好評，我也買了一本新的筆記本。"}, {"id": "9-3", "level": 2, "prompt": "若保留材料一最後的筆記本細節，哪種補寫最能使它支持題旨？", "options": ["我在第一頁記下：這次老師給的分數比上次高多少", "我在第一頁列出：下次報告需要購買的各種文具", "我在第一頁寫下：先記下對方理由，再提出自己的問題", "我在第一頁畫下：書店的櫥窗和筆記本封面的花紋"], "answer": 2, "explanation": "記下對方理由是聽完的具體做法。分數、外觀、購物雖與報告周邊有關，仍未直接支持聆聽的改變。", "passage": "【寫作材料一｜自編】\n題目：〈那次，我學會先聽完〉\n原稿：討論報告時，我一聽見阿哲的建議就反駁。他停下來問：「你知道我為什麼這樣排嗎？」我才發現，自己只看了前兩頁。聽完他的說明後，我們重新分工。報告那天得到好評，我也買了一本新的筆記本。"}, {"id": "9-4", "level": 2, "prompt": "比較材料二甲乙，甲段較能支持〈一個小改變〉的主要原因是？", "options": ["用較肯定的保證，排除所有失敗的可能", "用較多不同事件，證明改變適用所有人", "用較多抽象詞語，強調成功者共有的條件", "用一個具體做法與結果，連到可實行的反思"], "answer": 3, "explanation": "甲呈現查看一分鐘及忘帶次數減少；乙多次重複改變、成功，缺少證據且保證過度。甲也沒有多個事件或所有人的資料。", "passage": "【寫作材料二｜自編】\n題目：〈一個小改變〉\n甲段：我每天把明天要帶的物品放在門口。起初總忘記，後來在睡前多留一分鐘查看。忘帶作業的次數減少了。我才知道，改變不一定從很大的決心開始，也能從每天做得到的一分鐘開始。\n乙段：改變很重要，改變能帶來希望，只要願意改變，每個人都能成功，因為成功的人都懂得改變。"}, {"id": "9-5", "level": 2, "prompt": "將「只要願意改變，每個人都能成功」修訂為較有分寸且保留鼓勵意味的句子，何者適當？", "options": ["願意調整做法，能增加改善結果的機會", "只要稍微改變，就能保證任何目標都達成", "只有已經成功的人，才有資格改變做法", "即使努力改變，結果也不可能有所改善"], "answer": 0, "explanation": "增加機會保留鼓勵但取消無條件成功保證。其餘更強的保證、資格限制或完全否定，改變了原意。", "passage": "【寫作材料二｜自編】\n題目：〈一個小改變〉\n甲段：我每天把明天要帶的物品放在門口。起初總忘記，後來在睡前多留一分鐘查看。忘帶作業的次數減少了。我才知道，改變不一定從很大的決心開始，也能從每天做得到的一分鐘開始。\n乙段：改變很重要，改變能帶來希望，只要願意改變，每個人都能成功，因為成功的人都懂得改變。"}, {"id": "9-6", "level": 3, "prompt": "段落句子：①我原想照舊各做各的。②聽完同學說明，我發現資料彼此重複。③於是我們重排分工。④這次我學會先理解問題，再決定做法。最順暢的順序是？", "options": ["①②③④", "②①③④", "①③②④", "④③①②"], "answer": 0, "explanation": "原想法→新發現→因而調整→反思。②①使原想法落在聽完後；①③②先改再發現，破壞於是的承接；④開頭且末句未收束也不合本組句意。"}, {"id": "9-7", "level": 3, "prompt": "編輯建議甲段末句改成「一分鐘足以解決生活中的所有困難」。此建議最需要修正的問題是？", "options": ["把敘事中的時間順序，改成按空間遠近排列", "把原本未完成的行動，誤寫成已經完成的行動", "把原本第三人稱的故事，改成第一人稱的感想", "把單一案例的有限改善，擴張成全面有效的保證"], "answer": 3, "explanation": "原例只支持整理物品及減少忘帶，不能推成所有困難。沒有第三人稱轉換，也沒有改動故事先後或空間。", "passage": "【寫作材料二｜自編】\n題目：〈一個小改變〉\n甲段：我每天把明天要帶的物品放在門口。起初總忘記，後來在睡前多留一分鐘查看。忘帶作業的次數減少了。我才知道，改變不一定從很大的決心開始，也能從每天做得到的一分鐘開始。\n乙段：改變很重要，改變能帶來希望，只要願意改變，每個人都能成功，因為成功的人都懂得改變。"}, {"id": "9-8", "level": 3, "prompt": "若要讓材料一結尾更扣住「先聽完」，哪句最適當？", "options": ["那次之後，我認為每次討論都應接受阿哲的意見", "那次之後，我把報告高分當成合作成功的唯一標準", "那次之後，聽到不同意見時，我會先問對方的理由", "那次之後，我不再提出問題，以免影響討論速度"], "answer": 2, "explanation": "先問理由具體延續學習。先聽完不等於全盤同意、只追高分或停止提問；這些都把主旨改成另一種態度。", "passage": "【寫作材料一｜自編】\n題目：〈那次，我學會先聽完〉\n原稿：討論報告時，我一聽見阿哲的建議就反駁。他停下來問：「你知道我為什麼這樣排嗎？」我才發現，自己只看了前兩頁。聽完他的說明後，我們重新分工。報告那天得到好評，我也買了一本新的筆記本。"}]}];

const videos=[
['字音字形','均一：字音［八］多音','https://www.junyiacademy.org/videos/-0wwX9jMeWU','八年級補強；平台可能要求登入。'],

['詞性與語法','詞類簡介・林伶老師','https://www.youtube.com/watch?v=HHTo81A7XQM','由力宇教育公開文章連結，對應臺灣國中國文。'],
['文言文','均一：文言虛字系列','https://www.junyiacademy.org/topics/coocjun-c2-02','包括之、而、以、於；以平台確認的系列入口為準。'],
['文言閱讀','王藍田食雞子：文意與作品特色','https://www.learnmode.net/flip/video/5327','臺灣國文教師賴璞；依本次課文範圍選看。'],

['寫作','審題、立意及取材','https://www.learnmode.net/flip/video/9590','國教院授權教學影片。'],
['寫作延伸','新北市教育局・大師教寫作','https://udncollege.udn.com/8967/','臺灣會考寫作課程索引，並非單支影片直連。']

let page='learn',unit=0,level=0,quiz=null,answers={},reviewUnit='all',reviewLevel=0;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const levels=['全部難度','基礎：語境與概念','辨析：近似選項判別','應用：證據與整合'];
const passage=q=>q.passage?`<div class="passage" aria-label="閱讀材料">${esc(q.passage)}</div>`:'';
const pill=l=>`<span class="pill level${l}">${esc(levels[l])}</span>`;
function levelOptions(v){return levels.map((x,i)=>`<option value="${i}" ${Number(v)===i?'selected':''}>${esc(x)}</option>`).join('')}
function nav(){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')})}
function sidebar(){return `<aside aria-label="複習單元">${modules.map((m,i)=>`<button data-unit="${i}" class="${i===unit?'active':''}">${String(i+1).padStart(2,'0')}　${esc(m.title)}<span>8 題 · 基礎 2／辨析 3／應用 3</span></button>`).join('')}</aside>`}
function render(){nav();if(page==='learn'){app.innerHTML=`<div class="layout">${sidebar()}<section id="content"></section></div>`;renderLearn()}else if(page==='review')renderReview();else renderSources()}
function renderLearn(){const m=modules[unit],box=document.getElementById('content');if(quiz){renderQuiz(box);return}box.innerHTML=`<article class="card"><span class="pill">單元 ${unit+1} / 9</span><h2>${esc(m.title)}</h2><p class="muted">${esc(m.subtitle)}</p>${m.notes.map(n=>`<section class="note"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></section>`).join('')}<div class="tools"><label for="difficulty">練習難度</label><select id="difficulty">${levelOptions(level)}</select><button class="primary" id="start">開始練習（${m.questions.filter(q=>!level||q.level===Number(level)).length}題）</button></div><p class="meta">每題作答後可查看解析；題庫檢閱可一次查看本單元的全部答案。</p></article><div class="two"><div class="card"><h3>如何複習</h3><p>選答案前先找依據，並試著指出最接近的錯誤選項差在哪裡。可用「判斷理由」留下推理，再與解析比對。</p></div><div class="card"><h3>本單元完成情況</h3><p>${m.questions.filter(q=>q.id in answers).length} / ${m.questions.length} 題已作答</p><button class="secondary" id="inspect">檢閱本單元題目</button></div></div>`}
function renderQuiz(box){const qs=quiz.questions,q=qs[quiz.index];if(!q){const correct=qs.filter(x=>answers[x.id]===x.answer).length;box.innerHTML=`<section class="card"><h2>本次練習完成</h2><p>答對 ${correct} / ${qs.length} 題。這是本次練習結果，不等於段考成績預測。</p><h3>需要再看的題目</h3>${qs.filter(x=>answers[x.id]!==x.answer).map(x=>`<div class="note"><p>${esc(x.prompt)}</p><p><strong>正確答案：</strong>${esc(x.options[x.answer])}</p><p>${esc(x.explanation)}</p></div>`).join('')||'<p>本次全部答對，可試試其他難度。</p>'}<button id="back" class="primary">回到重點</button></section>`;return}
const done=q.id in quiz.attempts,selected=quiz.selected;box.innerHTML=`<article class="card"><div class="reviewhead"><span class="meta">${esc(modules[unit].title)} · 第 ${quiz.index+1} / ${qs.length} 題</span><button class="secondary" id="back">回到重點</button></div><div class="progress" aria-hidden="true"><div style="width:${quiz.index/qs.length*100}%"></div></div>${pill(q.level)}${passage(q)}<h2 class="question-text" style="margin-top:16px;font-size:23px">${esc(q.prompt)}</h2><div class="options" role="group" aria-label="答案選項">${q.options.map((o,i)=>`<button class="option ${done?(i===q.answer?'correct':i===quiz.attempts[q.id]?'wrong':''):selected===i?'selected':''}" data-choice="${i}" ${done?'disabled':''} aria-pressed="${selected===i}">${'ABCD'[i]}　${esc(o)}</button>`).join('')}</div><div class="reasonbox"><label for="reason"><strong>判斷理由（選填）</strong></label><p class="meta">引用哪個詞句？另一個近似選項差在哪裡？先留下想法，再看解析。</p><textarea id="reason" class="reason" placeholder="例如：依據……，所以……；另一個選項把……誤當成……。" ${done?'readonly':''}>${esc(quiz.reasons[q.id]||'')}</textarea></div>${done?`<div class="feedback ${quiz.attempts[q.id]===q.answer?'good':'bad'}" role="status"><strong>${quiz.attempts[q.id]===q.answer?'答對了':'再釐清一次'} · 正確答案 ${'ABCD'[q.answer]}</strong><p>${esc(q.explanation)}</p></div><div class="tools"><button id="next" class="primary">${quiz.index===qs.length-1?'查看結果':'下一題'}</button></div>`:`<p class="meta" id="hint" role="status">先選擇答案，再確認。</p><button id="confirm" class="primary">確認答案</button>`}</article>`}
function renderReview(){const list=modules.flatMap((m,i)=>m.questions.map(q=>({...q,unit:i,title:m.title}))).filter(q=>(reviewUnit==='all'||q.unit===Number(reviewUnit))&&(!reviewLevel||q.level===Number(reviewLevel)));app.innerHTML=`<section class="card"><div class="reviewhead"><div><span class="pill">供家長／教師檢查</span><h2>題庫檢閱</h2><p class="muted">直接閱讀題目、選項與答案解析，評估難度與範圍。</p></div><button class="secondary noprint" id="print">列印目前題目</button></div><div class="tools"><label for="review-unit">單元</label><select id="review-unit"><option value="all">全部單元</option>${modules.map((m,i)=>`<option value="${i}" ${reviewUnit===String(i)?'selected':''}>${esc(m.title)}</option>`).join('')}</select><label for="review-level">難度</label><select id="review-level">${levelOptions(reviewLevel)}</select><span class="meta">目前 ${list.length} 題</span></div><p class="meta">基礎18題、辨析27題、應用27題。選項以近似概念、錯誤指代、範圍擴大與因果倒置設計；解析說明正解依據及干擾選項的問題。全部題目為自編，未直接複製考古題。</p>${list.map((q,i)=>`<article class="review-item">${q.passage!==list[i-1]?.passage?passage(q):''}<span class="meta">${esc(q.title)} · 題號 ${q.id}</span> ${pill(q.level)}<h3 class="question-text">${esc(q.prompt)}</h3><ol type="A">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><div class="answer"><strong>答案：${'ABCD'[q.answer]}　${esc(q.options[q.answer])}</strong><br>${esc(q.explanation)}</div></article>`).join('')}</section>`}
function link(url,label){return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`}
function renderSources(){app.innerHTML=`<section class="card"><h2>資料來源與影片</h2><p>本版以臺灣國中國文為準。考古題用於參考題型，知識點與練習為自行整理；單元並非任何一本課本的完整替代。</p><div class="notice">香港 DSE／初中影片已排除。來源不明、只有社群摘要或未確認頻道的影片，不納入本版正式教材。影片未逐支完整觀看；連結、登入條件與播放狀態可能變動。</div><h3>知識與考古題參考</h3><div class="tablewrap"><table><thead><tr><th scope="col">來源</th><th scope="col">使用說明</th></tr></thead><tbody>${sources.map(s=>`<tr><td>${link(s[1],s[0])}</td><td>${esc(s[2])}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:30px">影片學習入口</h3><p class="meta">以可確認臺灣教學背景的入口為主，包含 YouTube 直連、教育平台影片與課程索引。需連網觀看。</p>${videos.map(v=>`<section class="note"><span class="pill">${esc(v[0])}</span><h3>${link(v[2],v[1])}</h3><p>${esc(v[3])}</p></section>`).join('')}<details><summary>之前找到、尚未採用的資料</summary><p>溪湖111、112上轉載試卷；彰化大同、和美、臺中五權、大道、苗栗國中題庫線索；Facebook、Threads與部落格資源索引，因原卷、答案或全文未核對，不用來決定本版題目答案。新莊、中正、三和114上官方公告列有試卷，但附件未讀取。</p></details><details><summary>範圍與難度說明</summary><p>本次重寫全題庫，增加近似選項、語境義、充分／必要條件、資料比對、文言寓意、詩歌對照與寫作修訂。詞性、字詞與閱讀可作跨版本複習。古詩、世說新語、史記等知識應依本次篇目與老師指定範圍使用。六書、書體、經史子集、應用文與完整句型系統未列為本版核心。文字閱讀單元使用自編短文，無須先讀指定課本。</p></details></section>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.unit!==undefined){unit=Number(b.dataset.unit);quiz=null;render();return}if(b.id==='start'){const qs=modules[unit].questions.filter(q=>!level||q.level===Number(level));quiz={questions:qs,index:0,selected:null,attempts:{},reasons:{}};renderLearn()}if(b.dataset.choice!==undefined){quiz.selected=Number(b.dataset.choice);renderLearn()}if(b.id==='confirm'){if(quiz.selected===null){document.getElementById('hint').textContent='請先選擇一個答案。';return}const q=quiz.questions[quiz.index];quiz.attempts[q.id]=quiz.selected;answers[q.id]=quiz.selected;renderLearn()}if(b.id==='next'){quiz.index++;quiz.selected=null;renderLearn()}if(b.id==='back'){quiz=null;renderLearn()}if(b.id==='inspect'){reviewUnit=String(unit);reviewLevel=0;page='review';render()}if(b.id==='print')window.print()});
document.addEventListener('input',e=>{if(e.target.id==='reason'&&quiz&&quiz.questions[quiz.index])quiz.reasons[quiz.questions[quiz.index].id]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='difficulty'){level=Number(e.target.value);renderLearn()}if(e.target.id==='review-unit'){reviewUnit=e.target.value;renderReview()}if(e.target.id==='review-level'){reviewLevel=Number(e.target.value);renderReview()}});
render();
</script><noscript><div class="card">請在瀏覽器啟用 JavaScript，以使用題目與單元切換。</div></noscript></body></html>
